<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikewatching</title>

    <!-- Global styles -->
    <link rel="stylesheet" href="global.css" />

    <!-- Mapbox GL JS CSS -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  </head>

  <body>
    <header id="page-header">
      <h1>🚴🏼‍♀️ Bikewatching</h1>

      <!-- Time filter -->
      <label id="time-filter">
        <span>Filter by time:</span>
        <input
          id="time-slider"
          type="range"
          min="-1"
          max="1440"
          step="1"
          value="-1"
          aria-label="Filter by time of day"
        />
        <time id="selected-time"></time>
        <em id="any-time">(any time)</em>
      </label>
    </header>

    <p>An immersive, interactive map of Boston-area bike traffic.</p>

    <!-- Map container + SVG overlay + HTML tooltip -->
    <div id="map">
      <svg id="overlay"></svg>
      <div id="tooltip" role="tooltip" aria-hidden="true"></div>
    </div>

    <!-- Map + D3 logic -->
    <script src="map.js" type="module" defer></script>
  </body>
</html>
