<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikewatching</title>

    <!-- Global styles -->
    <link rel="stylesheet" href="global.css" />

    <!-- Mapbox GL JS CSS -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
      rel="stylesheet"
    />

    <!-- Map-specific styles -->
    <link rel="stylesheet" href="map.css" />

    <!-- Favicon -->
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  </head>

  <body>
    <h1>🚴🏼‍♀️ Bikewatching</h1>
    <p>An immersive, interactive map of Boston-area bike traffic.</p>

<!-- Map container -->
<div id="map">
  <svg id="overlay"></svg>
</div>


    <!-- Mapbox JS (loaded after the DOM so #map exists) -->
    <script src="map.js" type="module" defer></script>
  </body>
</html>
